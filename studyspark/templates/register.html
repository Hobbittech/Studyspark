{% extends "base.html" %}
{% block title %}Sign up · StudySpark{% endblock %}
{% block content %}
<div class="container auth-container">
  <div class="card auth-card">
    <h1>Create your account ⚡</h1>
    <p class="muted">Free forever. Upgrade when you're ready.</p>
    <form method="POST" class="form">
      <label>Username
        <input type="text" name="username" required minlength="3" maxlength="30" placeholder="e.g. study_ninja" autocomplete="username">
      </label>
      <label>Email
        <input type="email" name="email" required placeholder="you@example.com" autocomplete="email">
      </label>
      <label>Password
        <input type="password" name="password" required minlength="6" placeholder="at least 6 characters" autocomplete="new-password">
      </label>
      <label>Confirm password
        <input type="password" name="confirm" required minlength="6" autocomplete="new-password">
      </label>
      <button class="btn btn-primary btn-block" type="submit">Sign up free 🚀</button>
    </form>
    <p class="muted center">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
